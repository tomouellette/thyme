name: Build pineapple command-line binaries
permissions:
  contents: write
  packages: write
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: pineapple-linux-64.tar.gz
            artifact_name: linux-64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_name: pineapple-linux-64-ubuntu-22.04.tar.gz
            artifact_name: linux-64-ubuntu-22.04
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: pineapple-win-64.tar.gz
            artifact_name: win-64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name: pineapple-osx-64.tar.gz
            artifact_name: osx-64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: pineapple-osx-arm64.tar.gz
            artifact_name: osx-arm64
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache Cargo home
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }}
    - name: Build
      run: |
        cd pineapple-cli
        cargo build --release --target ${{ matrix.target }}
    - name: Prepare artifact
      shell: bash
      run: |
        cd pineapple-cli
        mkdir -p artifact
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp ../target/${{ matrix.target }}/release/pineapple.exe artifact/pineapple.exe
          tar -czvf ${{ matrix.archive_name }} -C artifact pineapple.exe
        else
          cp ../target/${{ matrix.target }}/release/pineapple artifact/pineapple
          tar -czvf ${{ matrix.archive_name }} -C artifact pineapple
        fi
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pineapple-${{ matrix.artifact_name }}  # Unique artifact name
        path: pineapple-cli/${{ matrix.archive_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Display structure of downloaded files
      run: ls -R artifacts
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          artifacts/pineapple-linux-64/*
          artifacts/pineapple-linux-64-ubuntu-22.04/*
          artifacts/pineapple-win-64/*
          artifacts/pineapple-osx-64/*
          artifacts/pineapple-osx-arm64/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
