[package]
name = "pineapple"
version = "0.0.4"
edition = "2024"
description = "Simplified processing for image-based cell profiling with pineapple"
license = "GNU GPLv3"
repository = "https://github.com/tomouellette/pineapple"

[[bin]]
name = "pineapple"
path = "src/main.rs"

[[bin]]
name = "docs"
path = "src/bin/doc.rs"
required-features = ["docs"]

[dependencies]
pineapple-core = { path = "../pineapple-core", version = "0.0.4" }
pineapple-data = { path = "../pineapple-data", version = "0.0.4" }
pineapple-neural = { path = "../pineapple-neural", version = "0.0.4" }

# CLI
clap = { version = "4.5.21", features = ["derive"] }

# Parallelism
rayon = "1.10.0"
tokio = { version = "1.43.0", features = ["full"] }
futures = "0.3.31"

# I/O
polars = { version = "0.46.0", features = ["parquet"] }
zarrs = "0.19.2"
serde = { version = "1.0.190", features = ["derive"] }
serde_json = "1.0.133"

# Utilities
colored = "2.1.0"
kdam = { version = "0.6.1", features = ["template", "rayon"] }

# Neural nets for windows
[target.'cfg(target_os = "windows")'.dependencies]
candle-core = { version = "0.8.2" }
candle-nn = { version = "0.8.2"}

# Neural nets for linux
[target.'cfg(target_os = "linux")'.dependencies]
candle-core = { version = "0.8.2" }
candle-nn = { version = "0.8.2" }
openssl = { version = "0.10", features = ["vendored"] }

# Neural nets for apple x86_64 
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
candle-core = { version = "0.8.2", features = ["accelerate"] }
candle-nn = { version = "0.8.2", features = ["accelerate"] }

# Neural nets for apple metal
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "0.8.2", features = ["metal", "accelerate"] }
candle-nn = { version = "0.8.2", features = ["metal", "accelerate"] }

# Optional: only compiled when generating docs
clap-markdown = { version = "0.1.5", optional = true }

[features]
default = []
docs = ["clap-markdown"]

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.3"
